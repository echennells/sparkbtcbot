name: Publish

# Publishes to npm with Sigstore provenance whenever a version tag is pushed.
# Releases become: bump version -> tag -> push tag; CI does the rest. No npm
# token lives on any laptop or in any repo secret — auth is npm "trusted
# publishing" (OIDC): npmjs.com is configured (package settings -> Trusted
# Publisher) to accept publishes ONLY from this workflow file in this repo.
# The id-token permission below is what lets the job prove that identity, and
# it's also what signs the provenance attestation linking the tarball to this
# exact commit + workflow run.

on:
  push:
    tags: ["v*"]

# Nothing at the workflow level: each job asks for what it needs. The token
# that can publish (id-token) belongs to a job that runs no third-party
# package code.
permissions:
  contents: read

jobs:
  # Install, verify, test. This is where dependency code runs: `npm ci`
  # installs the full tree and `npm test` executes vitest, vite and rolldown
  # (a native binary among them). None of it can mint the publishing
  # identity: this job has no id-token and read-only contents.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned, not @latest: an unpinned npm install ran before the hardening
      # step and so was not age-gated. 11.21.0 has min-release-age (11.10.0+).
      - name: Update npm
        run: npm install -g npm@11.21.0

      # Harden the runner before anything is installed. Placement is
      # load-bearing twice: AFTER setup-node, which prepends its toolcache to
      # PATH and would shadow the hardening; and AFTER the npm upgrade, because
      # min-release-age landed in npm 11.10.0 and on the runner's stock npm the
      # age gate is written and enforced by nothing.
      #
      # `intel: sfw` additionally routes the install through Socket Firewall's
      # known-malware blocklist -- the axis the age gate and script blocking
      # cannot cover (a 30-day-old package with no install script). Fail-open:
      # if Socket is unreachable it warns and the install proceeds unfiltered,
      # so it cannot itself block a release; verify only expects it when the
      # harden step reports it installed.
      - name: Harden package managers
        uses: echennells/supply-chain-hardening/action@v2
        with:
          ecosystems: npm
          intel: sfw

      - name: Install dependencies
        run: npm ci

      # Assert the hardening is in FORCE, not merely applied. After the install
      # so it also catches anything the install changed.
      - name: Verify hardening is in effect
        uses: echennells/supply-chain-hardening/action/verify@v2

      # A tag that fails tests must not ship.
      - name: Run tests
        run: npm test

      # Refuse to publish if the tag and package.json disagree — a mismatched
      # tag would otherwise silently publish the wrong version.
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

  # Publish from a fresh checkout of the same commit, installing nothing.
  # The tarball is the package.json `files` list read from the checkout (no
  # lifecycle scripts, no bundled dependencies), so `npm publish` needs no
  # node_modules, and no dependency code ever runs where the id-token is.
  # Before the split one job held the token while `npm ci` and `npm test`
  # ran the whole dev tree: a compromised dev dependency could rewrite a file
  # under lib/ or skills/ between checkout and publish, and the provenance
  # attestation would vouch for it (Trail of Bits review, SC-03).
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the tag
      id-token: write # OIDC: trusted-publishing auth + provenance signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No npm cache: the test job's cache is written after dependency code
      # has run, and this job installs nothing that would use it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a current npm (the runner's bundled one is too
      # old to speak OIDC to the registry). Same pin as the test job.
      - name: Update npm
        run: npm install -g npm@11.21.0

      # What ships is exactly the tagged commit: nothing installed, nothing
      # changed since checkout.
      - name: Check the tree is the tagged commit, untouched
        run: |
          if [ -e node_modules ]; then
            echo "node_modules exists in the publish job; it must install nothing" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree differs from the tagged commit:" >&2
            git status --porcelain >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public

      # Cut the GitHub Release from the same tag, so the Releases page cannot
      # drift behind npm the way it did from 0.4.3 through 0.6.3 — five tagged,
      # published versions with no Release, because this step did not exist and
      # nothing failed loudly once the manual habit stopped. Runs after the
      # publish so a tag that never reached npm does not get a Release either.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes are this version's CHANGELOG section: everything
          # between its own "## <version> " heading and the next heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            # No matching CHANGELOG section: still cut the Release rather than
            # fail the run, and let GitHub write the notes from the commits.
            echo "No CHANGELOG section for $VERSION; generating notes" >&2
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
