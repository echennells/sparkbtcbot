name: Publish

# Publishes to npm with Sigstore provenance whenever a version tag is pushed.
# Releases become: bump version -> tag -> push tag; CI does the rest. No npm
# token lives on any laptop or in any repo secret — auth is npm "trusted
# publishing" (OIDC): npmjs.com is configured (package settings -> Trusted
# Publisher) to accept publishes ONLY from this workflow file in this repo.
# The id-token permission below is what lets the job prove that identity, and
# it's also what signs the provenance attestation linking the tarball to this
# exact commit + workflow run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release for the tag
  id-token: write # OIDC: trusted-publishing auth + provenance signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs a current npm (the runner's bundled one is too
      # old to speak OIDC to the registry).
      - name: Update npm
        run: npm install -g npm@latest

      # Harden the runner before anything is installed.
      #
      # Trusted publishing already removes the stolen-token risk, but `npm ci`
      # runs BEFORE `npm publish`, so a dependency lifecycle script could alter
      # the tree that then ships -- under this workflow's own provenance
      # attestation. A signed artifact attesting to a commit whose contents
      # changed after checkout is worse than a leaked token.
      #
      # Placement is load-bearing twice: AFTER setup-node, which prepends its
      # toolcache to PATH and would shadow the hardening; and AFTER the npm
      # upgrade, because min-release-age landed in npm 11.10.0 and on the
      # runner's stock npm the age gate is written and enforced by nothing.
      #
      # `intel: sfw` additionally routes the install through Socket Firewall's
      # known-malware blocklist -- the axis the age gate and script blocking
      # cannot cover (a 30-day-old package with no install script). Fail-open:
      # if Socket is unreachable it warns and the install proceeds unfiltered,
      # so it cannot itself block a release; verify only expects it when the
      # harden step reports it installed.
      - name: Harden package managers
        uses: echennells/supply-chain-hardening/action@v2
        with:
          ecosystems: npm
          intel: sfw

      - name: Install dependencies
        run: npm ci

      # Assert the hardening is in FORCE, not merely applied. After the install
      # so it also catches anything the install changed.
      - name: Verify hardening is in effect
        uses: echennells/supply-chain-hardening/action/verify@v2

      # A tag that fails tests must not ship.
      - name: Run tests
        run: npm test

      # Refuse to publish if the tag and package.json disagree — a mismatched
      # tag would otherwise silently publish the wrong version.
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public

      # Cut the GitHub Release from the same tag, so the Releases page cannot
      # drift behind npm the way it did from 0.4.3 through 0.6.3 — five tagged,
      # published versions with no Release, because this step did not exist and
      # nothing failed loudly once the manual habit stopped. Runs after the
      # publish so a tag that never reached npm does not get a Release either.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes are this version's CHANGELOG section: everything
          # between its own "## <version> " heading and the next heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            # No matching CHANGELOG section: still cut the Release rather than
            # fail the run, and let GitHub write the notes from the commits.
            echo "No CHANGELOG section for $VERSION; generating notes" >&2
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
