# Builds the flake on every push and PR that touches it or the npm manifests,
# so a Nix user never discovers a broken `nix run github:echennells/sparkbtcbot`
# before CI does.
#
# The flake derives everything from package.json and package-lock.json —
# name, version, and (via importNpmLock) the whole dependency closure with its
# per-package integrity hashes. There is no separately maintained closure hash
# to regenerate, so a lockfile change is complete on its own; this job's role
# is verification: evaluate the flake, fetch the closure, package the CLI, and
# run it once.
name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - package.json
      - package-lock.json
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - package.json
      - package-lock.json
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build the flake
        run: nix build .# --print-build-logs

      - name: Smoke the built CLI
        run: ./result/bin/sparkbtcbot help
