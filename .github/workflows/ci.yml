name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # After setup-node, which would otherwise shadow this via its toolcache.
      #
      # Expect the age gate to report INERT on the node 20 and 22 legs:
      # min-release-age needs npm 11.10.0 and those ship npm 10, so the key is
      # written and enforced by nothing. The action says so rather than
      # claiming a gate it lacks. Script blocking applies on all three legs --
      # that is the control that stops a dependency executing code during
      # `npm ci`.
      - name: Harden package managers
        uses: echennells/supply-chain-hardening/action@v2
        with:
          ecosystems: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Practice what the README preaches on supply-chain hygiene. Separate job so a
  # dependency advisory is a distinct signal from a test failure, and runs once
  # (audit is lockfile-based, node-version-independent). --audit-level=high keeps
  # dev-only transitive moderates (e.g. postcss/protobufjs) from redding the build
  # while still failing hard on a high/critical.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high
