name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # Practice what the README preaches on supply-chain hygiene. Separate job so a
  # dependency advisory is a distinct signal from a test failure, and runs once
  # (audit is lockfile-based, node-version-independent). --audit-level=high keeps
  # dev-only transitive moderates (e.g. postcss/protobufjs) from redding the build
  # while still failing hard on a high/critical.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high
